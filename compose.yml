name: nexo

# Nexo v0.1.15 Server 正式部署。内置组件只监听本机回环地址，公网入口、
# Agent 控制通道和 Tunnel 数据通道由宿主机网络直接提供。
services:
  nexo-server:
    image: ghcr.io/thelinyue/nexo-server:0.1.15
    container_name: nexo-server
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/nexo:/data/nexo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8280/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
