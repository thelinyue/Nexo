[workspace]
resolver = "2"
members = [
    "crates/nexo-core",
    "crates/nexo-node",
    "crates/nexo-protocol",
    "crates/nexo-tunnel",
    "crates/nexo-server",
    "crates/nexo-agent",
]

[workspace.package]
version = "0.2.29"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
toml = "1"
tempfile = "3"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-io = "0.3"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
# SQLite INTEGER 保持现有编码，超出有符号 64 位范围的计数仍按错误处理。
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7", features = ["compat", "codec", "rt"] }
yamux = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
