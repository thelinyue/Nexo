name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  # 不同版本共用发布锁，避免检查最新版本后被另一场发布交叉覆盖。
  group: nexo-release
  cancel-in-progress: false

jobs:
  node-packages:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 判断独立节点发布范围
        id: scope
        run: echo "node=$(node -p "require('./release-manifest.json').components.includes('node')")" >> "$GITHUB_OUTPUT"
      - name: 构建原生节点与配套 Caddy
        if: steps.scope.outputs.node == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          bash docker/build-node.sh
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.node == 'true'
        with:
          name: nexo-node-${{ matrix.runner }}
          path: dist/nexo-node-*.tar.gz
          if-no-files-found: error
  publish:
    needs: node-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出发布标签
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 校验标签与项目版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          web_version="$(node -p "require('./web/package.json').version")"
          manifest_version="$(node -p "require('./release-manifest.json').version")"
          publish_server="$(node -p "require('./release-manifest.json').components.includes('server')")"
          publish_agent="$(node -p "require('./release-manifest.json').components.includes('agent')")"
          publish_node="$(node -p "require('./release-manifest.json').components.includes('node')")"
          if [[ "$GITHUB_REF_NAME" != "v${tag_version}" || -z "$tag_version" ]]; then
            echo "发布标签必须使用 v<版本号> 格式" >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$tag_version" || "$web_version" != "$tag_version" || "$manifest_version" != "$tag_version" ]]; then
            echo "标签、Cargo、Web 和发布清单版本不一致：tag=$tag_version cargo=$cargo_version web=$web_version manifest=$manifest_version" >&2
            exit 1
          fi
          if [[ "$publish_server" != "true" && "$publish_agent" != "true" && "$publish_node" != "true" ]]; then
            echo "发布清单至少要声明一个实际变化的组件" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "publish_server=$publish_server" >> "$GITHUB_OUTPUT"
          echo "publish_agent=$publish_agent" >> "$GITHUB_OUTPUT"
          echo "publish_node=$publish_node" >> "$GITHUB_OUTPUT"

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布 Server
        if: steps.version.outputs.publish_server == 'true'
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thelinyue/nexo-server:${{ steps.version.outputs.version }}
          build-args: |
            NEXO_VERSION=${{ steps.version.outputs.version }}
            NEXO_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=nexo-server
          cache-to: type=gha,mode=max,scope=nexo-server

      - name: 构建并发布 Agent
        if: steps.version.outputs.publish_agent == 'true'
        id: agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thelinyue/nexo-agent:${{ steps.version.outputs.version }}
          build-args: |
            NEXO_VERSION=${{ steps.version.outputs.version }}
            NEXO_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=nexo-agent
          cache-to: type=gha,mode=max,scope=nexo-agent

      - name: 更新实际发布组件的 latest
        if: steps.version.outputs.publish_server == 'true' || steps.version.outputs.publish_agent == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_SERVER: ${{ steps.version.outputs.publish_server }}
          PUBLISH_AGENT: ${{ steps.version.outputs.publish_agent }}
        run: |
          set -euo pipefail
          components=()
          if [[ "$PUBLISH_SERVER" == "true" ]]; then components+=(server); fi
          if [[ "$PUBLISH_AGENT" == "true" ]]; then components+=(agent); fi
          python3 .github/scripts/publish_latest.py --version "$VERSION" --components "${components[@]}" --apply

      - name: 取得原生节点包
        if: steps.version.outputs.publish_node == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: nexo-node-*
          path: dist
          merge-multiple: true

      - name: 生成部署包与发布说明
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          PUBLISH_SERVER: ${{ steps.version.outputs.publish_server }}
          PUBLISH_AGENT: ${{ steps.version.outputs.publish_agent }}
        run: |
          set -euo pipefail
          bundle="nexo-v${VERSION}-docker"
          mkdir -p "dist/${bundle}/config"
          cp LICENSE THIRD_PARTY_NOTICES.md release-manifest.json "dist/${bundle}/"
          cp "docs/releases/v${VERSION}.md" "dist/${bundle}/README.md"
          # 仅打包本次实际发布组件，避免无代码变化的组件被误升级。
          if [[ "$PUBLISH_SERVER" == "true" ]]; then
            cp compose.yml "dist/${bundle}/"
            cp config/server.toml "dist/${bundle}/config/"
            sed -i "s|nexo-server:latest|nexo-server:${VERSION}|" "dist/${bundle}/compose.yml"
          fi
          if [[ "$PUBLISH_AGENT" == "true" ]]; then
            cp compose.agent.yml "dist/${bundle}/"
            cp config/agent.toml "dist/${bundle}/config/"
            sed -i "s|nexo-agent:latest|nexo-agent:${VERSION}|" "dist/${bundle}/compose.agent.yml"
          fi
          cp -R licenses "dist/${bundle}/licenses"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          (cd dist && sha256sum nexo*.tar.gz > SHA256SUMS)
          cp "docs/releases/v${VERSION}.md" dist/release-notes.md
          {
            echo
            echo "### 不可变镜像摘要"
            if [[ "$PUBLISH_SERVER" == "true" ]]; then
              echo "- \`ghcr.io/thelinyue/nexo-server:${VERSION}@${SERVER_DIGEST}\`"
            fi
            if [[ "$PUBLISH_AGENT" == "true" ]]; then
              echo "- \`ghcr.io/thelinyue/nexo-agent:${VERSION}@${AGENT_DIGEST}\`"
            fi
          } >> dist/release-notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "Nexo v${VERSION}" --notes-file dist/release-notes.md
            gh release upload "v${VERSION}" dist/nexo*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "v${VERSION}" dist/nexo*.tar.gz dist/SHA256SUMS \
              --verify-tag --title "Nexo v${VERSION}" --notes-file dist/release-notes.md
          fi
