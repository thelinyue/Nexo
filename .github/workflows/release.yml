name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # 不同版本共用发布锁，避免两场发布交叉更新 latest。
  group: nexo-release
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      components: ${{ steps.version.outputs.components }}
      node: ${{ steps.version.outputs.node }}
      images: ${{ steps.version.outputs.images }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 校验发布标签和组件
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py scope

  node-packages:
    needs: scope
    if: needs.scope.outputs.node == 'true' && needs.scope.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 构建原生节点与配套 Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          bash docker/build-node.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nexo-node-${{ matrix.runner }}
          path: dist/nexo-node-*.tar.gz
          if-no-files-found: error
          overwrite: true

  images:
    needs: scope
    if: needs.scope.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.scope.outputs.images) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ needs.scope.outputs.version }}
      REVISION: ${{ github.sha }}
      PUBLISHED: ${{ needs.scope.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 登录 GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查同版本镜像
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .github/scripts
        run: |
          set -euo pipefail
          repository="thelinyue/nexo-$COMPONENT"
          digest=$(python3 - <<'PY'
          import os
          from publish_latest import Registry

          repository = "thelinyue/nexo-" + os.environ["COMPONENT"]
          registry = Registry(repository, os.environ["GITHUB_ACTOR"], os.environ["GH_TOKEN"], apply=False)
          manifest = registry.manifest(os.environ["VERSION"])
          print(manifest[2] if manifest else "")
          PY
          )
          if [[ -n "$digest" ]]; then
            image="ghcr.io/$repository@$digest"
            docker pull --platform linux/amd64 "$image"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")
            if [[ "$revision" != "$REVISION" || "$version" != "$VERSION" ]]; then
              echo "同版本镜像的提交或版本不匹配，停止发布" >&2
              exit 1
            fi
          elif [[ "$PUBLISHED" == 'true' ]]; then
            echo "正式版本镜像缺失，无法验证已有发布" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: 准备 Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 构建并上传数字版本镜像
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thelinyue/nexo-${{ matrix.component }}:${{ needs.scope.outputs.version }}
          build-args: |
            NEXO_VERSION=${{ needs.scope.outputs.version }}
            NEXO_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=nexo-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=nexo-${{ matrix.component }}
      - name: 记录发布镜像摘要
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p dist
          printf '%s\n' "$DIGEST" > "dist/$COMPONENT.digest"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: image-metadata-${{ matrix.component }}
          path: dist/${{ matrix.component }}.digest
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [scope, node-packages, images]
    # 所选构建必须成功，跳过的组件不阻塞发布。
    if: >-
      ${{
        !cancelled() && needs.scope.result == 'success' &&
        (needs.scope.outputs.images == '[]' || needs.images.result == 'success') &&
        (needs.scope.outputs.node == 'false' || needs.scope.outputs.published == 'true' || needs.node-packages.result == 'success')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      COMPONENTS: ${{ needs.scope.outputs.components }}
      IMAGES: ${{ needs.scope.outputs.images }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 取得原生节点包
        if: needs.node-packages.result == 'success'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: nexo-node-*
          path: dist
          merge-multiple: true
      - name: 取得容器镜像摘要
        if: needs.scope.outputs.images != '[]' && needs.scope.outputs.published == 'false'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-metadata-*
          path: dist
          merge-multiple: true
      - name: 生成部署包与发布说明
        if: needs.scope.outputs.published == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "docs/releases/v${VERSION}.md" dist/release-notes.md
          if [[ "$IMAGES" == '[]' ]]; then exit 0; fi

          bundle="nexo-v${VERSION}-docker"
          mkdir -p "dist/$bundle/config"
          cp LICENSE THIRD_PARTY_NOTICES.md release-manifest.json "dist/$bundle/"
          cp "docs/releases/v${VERSION}.md" "dist/$bundle/README.md"
          cp -R licenses "dist/$bundle/licenses"
          mapfile -t images < <(jq -r '.[]' <<< "$IMAGES")
          printf '\n### 不可变镜像摘要\n' >> dist/release-notes.md
          for component in "${images[@]}"; do
            compose=compose.yml
            if [[ "$component" == "agent" ]]; then compose=compose.agent.yml; fi
            cp "$compose" "dist/$bundle/"
            cp "config/$component.toml" "dist/$bundle/config/"
            sed -i "s|nexo-$component:latest|nexo-$component:${VERSION}|" "dist/$bundle/$compose"
            digest=$(cat "dist/$component.digest")
            printf -- '- `ghcr.io/thelinyue/nexo-%s:%s@%s`\n' "$component" "$VERSION" "$digest" >> dist/release-notes.md
          done
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
      - name: 发布或校验 GitHub Release
        run: mkdir -p dist && python3 .github/scripts/release.py publish
      - name: 更新实际发布镜像的 latest
        if: needs.scope.outputs.images != '[]'
        run: |
          set -euo pipefail
          mapfile -t images < <(jq -r '.[]' <<< "$IMAGES")
          python3 .github/scripts/publish_latest.py --version "$VERSION" --components "${images[@]}" --apply
