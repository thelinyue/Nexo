<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>{{SERVICE_NAME}}</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f5f8;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,360px);padding:32px 24px;border-radius:24px;background:#fff;box-shadow:0 12px 40px #1720330a}h1{font-size:24px;line-height:1.3;letter-spacing:-.02em;margin:0 0 8px;overflow-wrap:anywhere}p{color:#647084;margin:0 0 24px;line-height:1.5}label{display:block;font-size:14px;margin-bottom:8px}input,button{font:inherit;width:100%;min-height:48px;border-radius:12px}input{padding:12px;border:1px solid #bac2ce;background:transparent;color:inherit}button{margin-top:16px;border:0;background:#2864e8;color:#fff;font-weight:600;cursor:pointer}button:active{filter:brightness(.88)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #80a8ff;outline-offset:3px}#error{color:#bf2537;font-size:14px;margin:12px 0 0}#error:empty{display:none}@media(prefers-color-scheme:dark){:root{color:#eef1f7;background:#11141b}main{background:#1d222c}p{color:#a6b0c0}input{border-color:#536075}#error{color:#ff9ba5}}@media(max-height:440px){body{place-items:start center;padding:16px}main{padding:20px}}
</style></head><body><main><h1>{{SERVICE_NAME}}</h1><p>输入密码以访问</p><form><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="error"><p id="error" role="alert"></p><button type="submit">访问</button></form></main>
<script>
const form=document.querySelector('form'),button=document.querySelector('button'),password=document.querySelector('input'),error=document.querySelector('#error');
form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;error.textContent='';password.removeAttribute('aria-invalid');button.disabled=true;button.textContent='验证中…';try{const response=await fetch('/.nexo-access/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value,return_to:new URLSearchParams(location.search).get('return')||'/'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'暂时无法验证，请稍后重试');location.replace(data.return_to);}catch(e){error.textContent=e instanceof TypeError||e instanceof SyntaxError?'暂时无法验证，请稍后重试':e.message;password.setAttribute('aria-invalid','true');password.focus();}finally{button.disabled=false;button.textContent='访问';}});
</script></body></html>
