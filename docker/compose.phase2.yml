name: nexo

# 第二阶段生产示例。Server 与 Agent 使用 host network，公网端口和真实 LAN
# 路由都直接落在宿主机网络命名空间；Headscale/Caddy 管理端口仍只绑定回环地址。
services:
  nexo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NEXO_HTTP_ADDR: 0.0.0.0:8280
      NEXO_PUBLIC_BACKEND_ADDR: 127.0.0.1:9888
      NEXO_CONTROL_ADDR: 0.0.0.0:9890
      NEXO_TUNNEL_ADDR: 0.0.0.0:9891
      # Agent 收到的地址可按实际公网/LAN DNS 修改；不能使用容器服务名。
      NEXO_TUNNEL_ENDPOINT: ${NEXO_TUNNEL_ENDPOINT:-127.0.0.1:9891}
      NEXO_HEADSCALE_ENABLED: "true"
      NEXO_HEADSCALE_LISTEN_ADDR: 127.0.0.1:8281
      NEXO_HEADSCALE_API_URL: http://127.0.0.1:8281
      # 正式组网地址应为 https://mesh.<domain>；未配置域名时请保留默认受限状态。
      NEXO_HEADSCALE_URL: ${NEXO_HEADSCALE_URL:-https://mesh.example.com}
      NEXO_MESH_DNS_BASE_DOMAIN: ${NEXO_MESH_DNS_BASE_DOMAIN:-mesh.nexo.internal}
      NEXO_CADDY_ENABLED: "true"
      NEXO_CADDY_BIN: /usr/local/bin/caddy
      NEXO_CADDY_ADMIN_URL: http://127.0.0.1:8290
      NEXO_DATA_DIR: /data/nexo
      NEXO_WEB_DIR: /opt/nexo/web
    volumes:
      - ./data/nexo:/data/nexo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8280/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6

  # 每个实际 LAN 站点运行一个 Agent。一次性 token 只用于首次入网，
  # 成功后从 Compose 环境中移除，身份材料保存在持久卷。
  nexo-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NEXO_SERVER_URL: ${NEXO_SERVER_URL:-http://127.0.0.1:8280}
      NEXO_CONTROL_ADDR: ${NEXO_CONTROL_ADDR:-127.0.0.1:9890}
      NEXO_CONTROL_SERVER_NAME: ${NEXO_CONTROL_SERVER_NAME:-nexo-server}
      NEXO_TUNNEL_ADDR: ${NEXO_TUNNEL_ADDR:-127.0.0.1:9891}
      NEXO_TUNNEL_SERVER_NAME: ${NEXO_TUNNEL_SERVER_NAME:-nexo-server}
      NEXO_ENROLLMENT_TOKEN: ${NEXO_ENROLLMENT_TOKEN:-}
      NEXO_DEVICE_NAME: ${NEXO_DEVICE_NAME:-Nexo Gateway}
      NEXO_AGENT_CAPABILITIES: ${NEXO_AGENT_CAPABILITIES:-mesh,subnet_gateway,tunnel}
      NEXO_TAILSCALE_APPLY: ${NEXO_TAILSCALE_APPLY:-true}
      NEXO_TAILSCALED_ENABLED: ${NEXO_TAILSCALED_ENABLED:-true}
      NEXO_STATE_DIR: /data/nexo-agent
    volumes:
      - ./data/nexo-agent:/data/nexo-agent
    depends_on:
      nexo-server:
        condition: service_healthy
    restart: unless-stopped
