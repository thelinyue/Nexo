name: nexo-phase1-integration

# Linux CI 专用：两个隔离 LAN、两个非 privileged Gateway、Server/Headscale
# 以及不安装 Nexo/Tailscale 的普通终端。脚本在容器内执行双向 TCP/HTTPS 验收。
services:
  nexo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      NEXO_HTTP_ADDR: 0.0.0.0:8280
      NEXO_CONTROL_ADDR: 0.0.0.0:9890
      NEXO_HEADSCALE_LISTEN_ADDR: 0.0.0.0:8281
      NEXO_HEADSCALE_API_URL: http://127.0.0.1:8281
      NEXO_HEADSCALE_URL: http://172.27.0.2:8281
      # 集成拓扑使用内部 HTTP Mesh 地址；生产 Compose 不设置此开关。
      NEXO_MESH_ALLOW_INSECURE: "true"
      NEXO_MESH_DNS_BASE_DOMAIN: mesh.nexo.internal
    ports:
      - "127.0.0.1:19828:8280"
    networks:
      control:
        ipv4_address: 172.27.0.2
    volumes: [nexo-data:/data/nexo]

  home-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      # Tailscale 的无 SNAT 站点路由依赖 connmark 反向路径校验。
      net.ipv4.conf.all.src_valid_mark: "1"
      # 集成拓扑的双接口流量由 Tailscale 策略路由处理，避免默认严格反向校验
      # 在进入 FORWARD 前丢弃来自另一站点的 LAN 源地址。
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv6.conf.all.forwarding: "1"
    devices: [/dev/net/tun:/dev/net/tun]
    # control bridge 只承载控制面；禁止它在 Site Link 关闭后绕路到另一座
    # Docker LAN。Tailscale 的正常站点流量走 tailscale0，不受此规则影响。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        iptables -A FORWARD -o eth0 -d 192.168.20.0/24 -j REJECT
        && exec /usr/local/bin/nexo-agent
    networks:
      control: {}
      home-lan:
        ipv4_address: 192.168.10.2
    volumes: [home-agent-data:/data/nexo-agent]
    environment:
      # Tailscale MagicDNS 会接管容器 resolver；控制面使用固定地址，
      # 避免 Agent 重启时暂时无法解析 Docker 服务名。
      NEXO_SERVER_URL: http://172.27.0.2:8280
      NEXO_CONTROL_ADDR: 172.27.0.2:9890
      NEXO_CONTROL_SERVER_NAME: nexo-server
      NEXO_ENROLLMENT_TOKEN: ${NEXO_HOME_ENROLLMENT_TOKEN:-}
      NEXO_TAILSCALE_APPLY: "true"
      NEXO_TAILSCALED_ENABLED: "true"
      NEXO_AGENT_CAPABILITIES: mesh,subnet_gateway,site_gateway
      NEXO_DEVICE_NAME: 家庭网关

  office-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv6.conf.all.forwarding: "1"
    devices: [/dev/net/tun:/dev/net/tun]
    # 与家庭网关对称地阻断 control bridge 到家庭 LAN 的旁路转发。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        iptables -A FORWARD -o eth0 -d 192.168.10.0/24 -j REJECT
        && exec /usr/local/bin/nexo-agent
    networks:
      control: {}
      office-lan:
        ipv4_address: 192.168.20.2
    volumes: [office-agent-data:/data/nexo-agent]
    environment:
      NEXO_SERVER_URL: http://172.27.0.2:8280
      NEXO_CONTROL_ADDR: 172.27.0.2:9890
      NEXO_CONTROL_SERVER_NAME: nexo-server
      NEXO_ENROLLMENT_TOKEN: ${NEXO_OFFICE_ENROLLMENT_TOKEN:-}
      NEXO_TAILSCALE_APPLY: "true"
      NEXO_TAILSCALED_ENABLED: "true"
      NEXO_AGENT_CAPABILITIES: mesh,subnet_gateway,site_gateway
      NEXO_DEVICE_NAME: 办公网关

  home-terminal:
    build:
      context: .
      dockerfile: Dockerfile.integration-terminal
    command:
      - --address
      - 192.168.10.100
      - --remote-prefix
      - 192.168.20.0/24
      - --next-hop
      - 192.168.10.2
    cap_add: [NET_ADMIN]
    networks:
      home-lan:
        ipv4_address: 192.168.10.100
    depends_on: [home-gateway]

  office-terminal:
    build:
      context: .
      dockerfile: Dockerfile.integration-terminal
    command:
      - --address
      - 192.168.20.100
      - --remote-prefix
      - 192.168.10.0/24
      - --next-hop
      - 192.168.20.2
    cap_add: [NET_ADMIN]
    networks:
      office-lan:
        ipv4_address: 192.168.20.100
    depends_on: [office-gateway]

networks:
  control:
    ipam:
      config: [{subnet: 172.27.0.0/16}]
  home-lan:
    driver_opts:
      # 某些 Docker Engine 默认关闭 ICC；验收终端必须能把包交给同一 LAN
      # 的 Gateway，才能验证真实的站点间路由，而不是只验证控制平面状态。
      com.docker.network.bridge.enable_icc: "true"
      # Docker 29 默认会在 raw/PREROUTING 丢弃来自其他 bridge、目标为
      # 本 bridge 容器地址的报文；站点路由需要保留远端 LAN 源地址并跨 bridge
      # 进入 Gateway，因此集成拓扑使用官方的无保护 NAT 模式。
      com.docker.network.bridge.gateway_mode_ipv4: "nat-unprotected"
    ipam:
      config: [{subnet: 192.168.10.0/24}]
  office-lan:
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.gateway_mode_ipv4: "nat-unprotected"
    ipam:
      config: [{subnet: 192.168.20.0/24}]

volumes:
  nexo-data:
  home-agent-data:
  office-agent-data:
