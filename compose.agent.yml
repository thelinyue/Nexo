name: nexo-agent

# 手动部署时先准备 ./data/nexo-agent/agent.toml；页面部署命令会自动保存。
services:
  nexo-agent:
    image: ghcr.io/thelinyue/nexo-agent:latest
    container_name: nexo-agent
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/nexo-agent:/data/nexo-agent
    restart: unless-stopped
