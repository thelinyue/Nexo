name: nexo-agent

# 全新安装；先将管理页面生成的 agent.toml 保存到 ./data/nexo-agent/。
services:
  nexo-agent:
    image: ghcr.io/thelinyue/nexo-agent:latest
    container_name: nexo-agent
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/nexo-agent:/data/nexo-agent
    restart: unless-stopped
