name: nexo-agent

# Agent v0.2.7 起支持以下连接环境变量；空值沿用数据目录中的 agent.toml。
services:
  nexo-agent:
    image: ghcr.io/thelinyue/nexo-agent:latest
    container_name: nexo-agent
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      NEXO_SERVER_URL: ${NEXO_SERVER_URL:-}
      NEXO_ENROLLMENT_TOKEN: ${NEXO_ENROLLMENT_TOKEN:-}
      NEXO_DEVICE_NAME: ${NEXO_DEVICE_NAME:-}
    volumes:
      - ./data/nexo-agent:/data/nexo-agent
    restart: unless-stopped
